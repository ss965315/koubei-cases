<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>【口碑案例優化】各店案例管理</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@700;900&family=DM+Mono:wght@400;500&display=swap">
<style>
:root{
--bg:#F4F2ED; --surface:#FFF; --surface2:#F9F7F3; --border:#DDD8CF; --border2:#C8C2B5;
--text:#1C1A17; --text2:#5C5750; --text3:#9C9690;
--accent:#2D4A3E; --accent-l:#E4EDE9;
--pink:#C0394A; --pink-bg:#FFF0F2; --pink-border:#F0C0C8;
--ok:#1B5C3A; --ok-bg:#E4EDE9; --warn:#B45F06; --warn-bg:#FEF3E6; --mute:#8C8781; --mute-bg:#EFEDE8;
--mono:'DM Mono',monospace;
--brand-red:#EC3F43; --brand-red-dark:#C22026; --brand-gold:#D9A66C;
--brand-rose-bg:#FFF0F2; --brand-rose-border:#F3C9CE;
--gold:#E8C877; --silver:#C9CDD3; --bronze:#E3B08C;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{font-size:13px}
body{font-family:'Noto Sans TC',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
button,input,select,textarea{font-family:inherit}
[hidden]{display:none!important}

/* login */
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
.login-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;box-shadow:0 8px 40px rgba(0,0,0,.08);width:100%;max-width:380px;padding:30px 28px 24px}
.login-logo{font-size:30px;text-align:center}
.login-title{font-size:16px;font-weight:700;color:var(--accent);text-align:center;margin:6px 0 22px}
.login-card .fg input{font-size:14px;padding:10px 12px}
.login-card .btn{width:100%;justify-content:center;padding:10px;font-size:14px;margin-top:6px}
.login-err{color:var(--pink);font-size:12px;min-height:18px;margin-top:10px;text-align:center}
.login-note{color:var(--text3);font-size:11px;text-align:center;margin-top:12px;line-height:1.7}

/* header */
.header{background:var(--surface);border-bottom:1px solid var(--border);padding:0 20px;min-height:50px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;position:sticky;top:0;z-index:200;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.hlogo{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.htitle{font-size:13px;font-weight:700;color:var(--accent)}
.hsub{font-size:10px;color:var(--text3);margin-left:8px}
.hright{display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding:6px 0}

/* tabs */
.branch-bar{background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:flex-end;padding:0 20px;overflow-x:auto;position:sticky;top:50px;z-index:190}
.btab{padding:9px 16px 8px;font-size:12px;font-weight:500;color:var(--text3);cursor:pointer;border:none;background:none;border-bottom:2px solid transparent;white-space:nowrap;transition:all .13s}
.btab:hover{color:var(--text)}
.btab.active{color:var(--accent);border-bottom-color:var(--accent)}
.btab small{font-size:10px;color:var(--text3);margin-left:3px}
.btab.stab{color:var(--text2);border-left:1px solid var(--border);padding-left:16px}
.btab.stab.first{margin-left:auto}
.btab.stab.active{color:var(--accent);border-bottom-color:var(--accent)}
.btab.board-tab{color:var(--brand-red-dark)}
.btab.board-tab.active{color:var(--brand-red);border-bottom-color:var(--brand-red)}
.month-bar{padding:10px 20px 0;display:flex;gap:4px;align-items:flex-end;flex-wrap:wrap;background:var(--surface);border-bottom:1px solid var(--border)}
.year-sel{font-size:12px;font-weight:700;padding:4px 8px;margin:0 8px 6px 0;border:1px solid var(--border);border-radius:5px;background:var(--surface);color:var(--accent)}
.mbtn{padding:4px 12px 8px;font-size:11px;font-weight:500;cursor:pointer;background:transparent;color:var(--text3);border:none;border-bottom:2px solid transparent;white-space:nowrap}
.mbtn:hover{color:var(--text)}
.mbtn.active{color:var(--accent);border-bottom-color:var(--accent);font-weight:700}
.mbtn small{font-size:9px;color:var(--text3);margin-left:2px}

/* toolbar */
.toolbar{display:flex;gap:8px;align-items:center;padding:12px 20px;background:var(--surface);border-bottom:1px solid var(--border);flex-wrap:wrap}
.tl{display:flex;gap:6px;align-items:center;flex:1;flex-wrap:wrap}
.tr{display:flex;gap:6px;align-items:center}
.vt{display:flex;border:1px solid var(--border);border-radius:5px;overflow:hidden}
.vtb{padding:5px 11px;font-size:11px;cursor:pointer;background:var(--surface);border:none;color:var(--text2)}
.vtb.active{background:var(--accent);color:#fff}
.fsel,.fsearch{font-size:12px;padding:5px 9px;border:1px solid var(--border);border-radius:5px;background:var(--surface);color:var(--text)}
.fsearch{width:190px}
.count-lbl{font-size:11px;color:var(--text3)}
.btn{display:inline-flex;align-items:center;gap:4px;padding:6px 12px;border:1px solid var(--border);border-radius:5px;background:var(--surface);color:var(--text);font-size:12px;cursor:pointer;transition:all .12s;white-space:nowrap}
.btn:hover:not(:disabled){background:var(--bg);border-color:var(--border2)}
.btn:active:not(:disabled){transform:scale(.98)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn-primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn-primary:hover:not(:disabled){background:#1F3529}
.btn-pub{background:var(--brand-red-dark);color:#fff;border-color:var(--brand-red-dark)}
.btn-pub:hover:not(:disabled){background:#A01A1F}
.btn-danger{color:var(--pink)}
.btn-danger:hover:not(:disabled){background:var(--pink-bg)}
.btn-sm{padding:4px 9px;font-size:11px}
.btn-icon{padding:5px 7px}

/* list */
.main-content{padding:16px 20px 48px}
.table-wrap{background:var(--surface);border:1px solid var(--border);border-radius:10px;overflow-x:auto;box-shadow:0 1px 4px rgba(0,0,0,.06)}
table{width:100%;border-collapse:collapse;font-size:12px}
th{background:var(--surface2);padding:8px 10px;font-size:10px;font-weight:700;color:var(--text3);letter-spacing:.05em;border-bottom:1px solid var(--border);white-space:nowrap;text-align:left}
td{padding:7px 10px;border-bottom:1px solid var(--border);vertical-align:middle;white-space:nowrap}
tbody tr:last-child td{border-bottom:none}
.case-table tbody tr{cursor:pointer}
.case-table tbody tr:hover td{background:#FAFAF8}
.tdr,.thr{text-align:right}
.tdc,.thc{text-align:center}
.mono{font-family:var(--mono)}
code{font-family:var(--mono);font-size:11px;color:var(--text2)}
.cb{width:15px;height:15px;cursor:pointer;accent-color:var(--accent)}
.cb-post{accent-color:var(--pink)}
.cb:disabled{cursor:default;opacity:1}

/* badges */
.g{display:inline-block;text-align:center;font-size:11px;font-weight:500;padding:2px 8px;border-radius:4px;border:1px solid transparent;white-space:nowrap}
.g-0{background:#E4EDE9;color:#1B5C3A;border-color:#B8D4C4}
.g-1{background:#EEF3FB;color:#1A3A6C;border-color:#B8CEDE}
.g-2{background:#FEF8EC;color:#7A5800;border-color:#DFC07A}
.g-3{background:#F4F2ED;color:#6B6560;border-color:#C8C2B5}
.g-none{font-family:'Noto Sans TC',sans-serif;font-weight:400;color:var(--text3);background:transparent;border-color:var(--border)}
.st{display:inline-block;font-size:11px;padding:2px 8px;border-radius:20px;font-weight:500}
.st-ok{background:var(--ok-bg);color:var(--ok)}
.st-warn{background:var(--warn-bg);color:var(--warn)}
.st-cancel{background:var(--mute-bg);color:var(--mute);text-decoration:line-through}
tr.is-cancel td{color:var(--mute)}
.flag{display:inline-block;font-size:10px;padding:1px 7px;border-radius:3px;border:1px solid var(--border);color:var(--text3)}
.flag.on{background:var(--ok-bg);color:var(--ok);border-color:#B8D4C4}
.flag.on.post{background:var(--pink-bg);color:var(--pink);border-color:var(--pink-border)}

/* cards */
.card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.dc{background:var(--surface);border:1px solid var(--border);border-radius:10px;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.06);cursor:pointer;transition:box-shadow .15s}
.dc:hover{box-shadow:0 4px 14px rgba(0,0,0,.1)}
.dc-body{padding:12px 14px}
.dc-top{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-bottom:6px}
.dc-name{font-size:14px;font-weight:700}
.dc-meta{font-size:11px;color:var(--text2);line-height:1.8}
.dc-flags{display:flex;gap:5px;margin-top:6px}
.dc-foot{display:flex;align-items:center;justify-content:space-between;padding:8px 14px;border-top:1px solid var(--border);font-size:11px;color:var(--text2)}
.dc-foot label{display:flex;align-items:center;gap:5px;cursor:pointer}

.empty{padding:56px 20px;text-align:center;color:var(--text3)}
.empty-ico{font-size:32px;margin-bottom:10px;display:block}
.empty p{font-size:12px;line-height:1.8}

/* stats */
.sec-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;gap:8px;flex-wrap:wrap}
.sec-title{font-size:15px;font-weight:700;color:var(--accent)}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;margin-bottom:16px}
.scard{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:12px 14px}
.scard-lbl{font-size:10px;color:var(--text3);letter-spacing:.04em;margin-bottom:4px}
.scard-val{font-size:22px;font-weight:700;font-family:var(--mono);color:var(--text)}
.scard-sub{font-size:10px;color:var(--text3);margin-top:2px}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:10px;overflow:hidden;margin-bottom:16px}
.panel-h{padding:10px 14px;background:var(--surface2);border-bottom:1px solid var(--border);font-size:12px;font-weight:700;color:var(--accent)}
.panel-b{padding:14px}
.bars{display:grid;grid-template-columns:repeat(12,1fr);gap:8px;align-items:end;height:190px}
.bar-col{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px}
.bar-v{font-family:var(--mono);font-size:11px;color:var(--text2)}
.bar{width:100%;max-width:38px;background:var(--accent);border-radius:4px 4px 0 0;min-height:2px}
.bar.zero{background:var(--border)}
.bar-l{font-size:10px;color:var(--text3)}
.mtable{width:100%;border-collapse:collapse;font-size:12px}
.mtable th{text-align:center}
.mtable th:first-child{text-align:left}
.mtable td{text-align:center;font-family:var(--mono)}
.mtable td:first-child{text-align:left;font-family:'Noto Sans TC',sans-serif;font-weight:500}
.mtable tr.total td{background:var(--surface2);font-weight:700;border-top:2px solid var(--border2)}
.mtable td.tot{font-weight:700;background:var(--surface2)}
.ovx{overflow-x:auto}

/* board */
.board-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.board-wrap{background:#fff;border:1px solid var(--brand-rose-border);border-radius:16px;overflow:hidden;box-shadow:0 6px 28px rgba(236,63,67,.10)}
.board-head{padding:26px 28px 22px;background:linear-gradient(120deg,var(--brand-red-dark) 0%,var(--brand-red) 45%,var(--brand-gold) 135%);color:#fff;position:relative;overflow:hidden}
.board-head::after{content:'';position:absolute;right:-40px;top:-60px;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.18),transparent 70%)}
.board-head-eyebrow{font-family:var(--mono);font-size:10px;letter-spacing:.22em;opacity:.85;margin-bottom:8px}
.board-head-title{font-family:'Noto Serif TC',serif;font-weight:900;font-size:22px;margin-bottom:6px;text-shadow:0 2px 10px rgba(0,0,0,.12);line-height:1.4}
.board-head-sub{font-size:12px;opacity:.95;line-height:1.6}
.board-body{padding:20px 22px 8px}
.board-col-title{font-size:13px;font-weight:700;color:var(--brand-red-dark);margin-bottom:10px;display:flex;justify-content:space-between;align-items:baseline}
.board-col-title small{font-size:10px;color:var(--text3);font-weight:400}
.board-row{display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:12px;margin-bottom:8px;background:var(--surface2);border:1px solid var(--border)}
.board-row.top1{background:linear-gradient(90deg,#FFF3D6,#FFFDF7);border-color:#E8C877;box-shadow:0 3px 14px rgba(217,166,108,.28)}
.board-row.top2{background:linear-gradient(90deg,#F1F2F5,#FDFDFE);border-color:#C9CDD3}
.board-row.top3{background:linear-gradient(90deg,#FBE6D6,#FFFAF5);border-color:#E3B08C}
.board-rank{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-weight:700;font-size:13px;background:var(--surface);color:var(--text2);flex-shrink:0;border:1px solid var(--border)}
.top1 .board-rank{background:var(--gold);color:#5B4300;border-color:#D9A66C}
.top2 .board-rank{background:var(--silver);color:#3D4046;border-color:#AEB2B8}
.top3 .board-rank{background:var(--bronze);color:#5A3117;border-color:#C88F62}
.board-name-wrap{flex:1;min-width:0}
.board-name{font-size:14px;font-weight:700}
.board-branch-tag{display:inline-block;font-size:10px;font-weight:500;color:var(--brand-red-dark);background:var(--brand-rose-bg);border:1px solid var(--brand-rose-border);border-radius:20px;padding:1px 9px;margin-left:6px;vertical-align:2px}
.board-sub{font-size:10px;color:var(--text3);margin-top:2px}
.board-count-wrap{text-align:right;flex-shrink:0;line-height:1.1}
.board-count{font-family:var(--mono);font-size:22px;font-weight:700;color:var(--brand-red-dark)}
.top1 .board-count{font-size:25px}
.board-count-lbl{font-size:9px;color:var(--text3)}
.board-foot{padding:14px 24px 20px;text-align:center;font-size:11px;color:var(--text2);border-top:1px dashed var(--border);margin-top:6px}

/* overlays */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.42);z-index:500;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:var(--surface);border-radius:10px;width:100%;max-width:600px;max-height:92vh;display:flex;flex-direction:column;box-shadow:0 8px 40px rgba(0,0,0,.2)}
.modal-h{padding:14px 18px 11px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:8px}
.modal-t{font-size:14px;font-weight:700}
.modal-b{padding:16px 18px;overflow-y:auto}
.modal-f{padding:11px 18px 14px;border-top:1px solid var(--border);display:flex;gap:6px;justify-content:flex-end;align-items:center}
.modal-f .grow{flex:1}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.fg{display:flex;flex-direction:column;gap:4px;margin-bottom:11px}
.fg label{font-size:11px;font-weight:500;color:var(--text2)}
.fg input,.fg select,.fg textarea{padding:7px 10px;border:1px solid var(--border);border-radius:5px;font-size:12px;color:var(--text);background:var(--surface);width:100%}
.fg input:focus,.fg select:focus,.fg textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(45,74,62,.08)}
.fg input:disabled,.fg select:disabled,.fg textarea:disabled{background:var(--surface2);color:var(--text);opacity:1}
.fg textarea{min-height:64px;resize:vertical}
.fg-full{grid-column:1/-1}
.checks{display:flex;gap:18px;flex-wrap:wrap;margin-bottom:12px}
.checks label{display:flex;align-items:center;gap:6px;font-size:12px;cursor:pointer}
.sec-lbl{font-size:10px;font-weight:700;letter-spacing:.07em;color:var(--text3);padding-bottom:7px;border-bottom:1px solid var(--border);margin:4px 0 12px}
.req{color:var(--pink)}
.hint{font-size:11px;color:var(--text3);line-height:1.7}
.pw-row{display:grid;grid-template-columns:110px 1fr 70px;gap:8px;align-items:center;margin-bottom:8px}
.pw-row input{padding:7px 10px;border:1px solid var(--border);border-radius:5px;font-size:12px}
.pw-state{font-size:11px;color:var(--text3)}
.pw-state.ok{color:var(--ok)}
.notice-list{font-size:13px;line-height:2}
.notice-list b{font-family:var(--mono);font-size:15px}
.notice-sub{font-size:12px;color:var(--text2);margin-top:8px;line-height:1.8}
.toast{position:fixed;bottom:20px;right:20px;background:var(--text);color:#fff;padding:8px 15px;border-radius:7px;font-size:12px;z-index:999;display:none;box-shadow:0 4px 16px rgba(0,0,0,.2);max-width:80vw}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:10px}

@media (max-width:760px){
  .header,.branch-bar,.month-bar,.toolbar,.main-content{padding-left:16px;padding-right:16px}
  .branch-bar,.header{position:static}
  .fgrid,.board-grid{grid-template-columns:1fr}
  .fsearch{width:100%}
  .bars{gap:3px}
  .pw-row{grid-template-columns:90px 1fr}
  .pw-state{grid-column:2}
}
</style>
</head>
<body>

<!-- 登入畫面 -->
<div class="login-wrap" id="login" hidden>
  <form class="login-card" id="login-form" autocomplete="on">
    <div class="login-logo">🏥</div>
    <div class="login-title">【口碑案例優化】各店案例管理</div>
    <div class="fg"><label for="lg-acc">帳號</label><input id="lg-acc" name="username" autocomplete="username" placeholder="例：M001"></div>
    <div class="fg"><label for="lg-pw">密碼</label><input id="lg-pw" name="password" type="password" autocomplete="current-password"></div>
    <button class="btn btn-primary" type="submit" id="lg-btn">登入</button>
    <div class="login-err" id="lg-err"></div>
    <div class="login-note" id="lg-note"></div>
  </form>
</div>

<div id="app" hidden>
<div class="header">
  <div class="hlogo">
    <span style="font-size:17px">🏥</span>
    <span class="htitle">【口碑案例優化】各店案例管理</span>
    <span class="hsub" id="save-lbl"></span>
  </div>
  <div class="hright no-shot" id="hright"></div>
</div>

<nav class="branch-bar" id="branch-bar"></nav>
<div class="month-bar" id="month-bar"></div>

<div class="toolbar" id="case-toolbar">
  <div class="tl">
    <div class="vt">
      <button class="vtb" data-layout="list">☰ 清單</button>
      <button class="vtb" data-layout="card">⊞ 卡片</button>
    </div>
    <select class="fsel" id="fl-grade"></select>
    <select class="fsel" id="fl-status"></select>
    <input type="search" class="fsearch" id="fl-search" placeholder="搜尋姓名 / 代碼 / 諮詢師">
  </div>
  <div class="tr">
    <span class="count-lbl" id="count-lbl"></span>
    <button class="btn btn-sm no-shot" data-shot>📸 下載本頁截圖(jpg)</button>
  </div>
</div>

<div class="toolbar" id="board-toolbar">
  <div class="tl">
    <span style="font-size:12px;color:var(--text2)">期間</span>
    <select class="fsel" id="board-period"></select>
  </div>
  <div class="tr"><button class="btn btn-sm no-shot" data-shot>📸 下載本頁截圖(jpg)</button></div>
</div>

<main class="main-content" id="content"></main>
</div>

<div id="overlay-root"></div>
<input type="file" id="import-file" accept=".xlsx,.xls,.xlsm,.csv" multiple hidden>
<div class="toast" id="toast"></div>

<script>
// ══════════════════════════════════════════
//  模式
//  一般網址：登入後唯讀瀏覽（資料來自加密的 data.enc.json）
//  網址加 ?admin=1：管理模式（資料存在這台電腦的瀏覽器，可匯入、編輯、發佈）
// ══════════════════════════════════════════
const ADMIN=new URLSearchParams(location.search).has('admin');
const BRANCHES=['仁愛','桃園','向上','巨蛋','竹北','北屯'];
const ACCOUNTS=[
  {id:'M001',branch:'仁愛'},{id:'M002',branch:'桃園'},{id:'M003',branch:'向上'},
  {id:'M005',branch:'巨蛋'},{id:'M006',branch:'竹北'},{id:'M007',branch:'北屯'},
  {id:'總部',branch:null},
];
const HQ_MIN_PW=8, PW_MIN=4;
// 授權等級與對應折讓金額
const GRADES=['全臉公開','匿名公開','院內公開','無折扣'];

// ══════════════════════════════════════════
//  加密（PBKDF2-SHA256 → AES-GCM 256）
// ══════════════════════════════════════════
const te=new TextEncoder(), td=new TextDecoder();
const b64=buf=>{const b=new Uint8Array(buf);let s='';for(let i=0;i<b.length;i+=0x8000)s+=String.fromCharCode.apply(null,b.subarray(i,i+0x8000));return btoa(s);};
const unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const rand=n=>crypto.getRandomValues(new Uint8Array(n));
async function pwKey(pw,salt,iter){
  const base=await crypto.subtle.importKey('raw',te.encode(pw),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:iter,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);
}
const aesKey=raw=>crypto.subtle.importKey('raw',raw,'AES-GCM',false,['encrypt','decrypt']);
async function seal(key,bytes){const iv=rand(12);return {i:b64(iv),c:b64(await crypto.subtle.encrypt({name:'AES-GCM',iv},key,bytes))};}
async function open_(key,e){return new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(e.i)},key,unb64(e.c)));}

// 管理者設定密碼：每個帳號一把隨機資料金鑰，用密碼包起來（瀏覽器只存金鑰，不存密碼）
async function makeAccountKey(pw){
  const raw=rand(32), salt=rand(16);
  const wrap=await seal(await pwKey(pw,salt,ITER),raw);
  return {s:b64(salt),w:wrap,k:b64(raw)};
}
async function loginDecrypt(file,acc,pw){
  const e=file.accounts&&file.accounts[normAcc(acc)];
  if(!e)throw new Error('bad');
  try{
    const raw=await open_(await pwKey(pw,unb64(e.s),file.iter),e.w);
    return JSON.parse(td.decode(await open_(await aesKey(raw),e.d)));
  }catch(err){throw new Error('bad');}
}

//  管理模式的本機儲存（IndexedDB）
// ══════════════════════════════════════════
const DB={
  db:null, mem:{cases:new Map(),meta:new Map()},
  open(){return new Promise((res,rej)=>{
    const r=indexedDB.open('koubei-cases',2);
    r.onupgradeneeded=()=>{const d=r.result;
      if(!d.objectStoreNames.contains('cases'))d.createObjectStore('cases',{keyPath:'id'});
      if(!d.objectStoreNames.contains('meta'))d.createObjectStore('meta');
      if(d.objectStoreNames.contains('photos'))d.deleteObjectStore('photos');};
    r.onsuccess=()=>{this.db=r.result;res();};
    r.onerror=()=>rej(r.error);
  });},
  run(store,mode,fn){
    if(!this.db){
      const m=this.mem[store], kp=store==='cases';
      const s={getAll:()=>({result:[...m.values()]}),get:k=>({result:m.get(k)}),delete:k=>{m.delete(k);return {};},put:(v,k)=>{m.set(kp?v.id:k,v);return {};}};
      const req=fn(s); return Promise.resolve(req&&'result' in req?req.result:undefined);
    }
    return new Promise((res,rej)=>{
      const t=this.db.transaction(store,mode), s=t.objectStore(store); const req=fn(s);
      t.oncomplete=()=>res(req&&'result' in req?req.result:undefined);
      t.onerror=()=>rej(t.error); t.onabort=()=>rej(t.error);
    });
  },
  allCases(){return this.run('cases','readonly',s=>s.getAll());},
  putCases(list){return this.run('cases','readwrite',s=>{list.forEach(c=>s.put(c));});},
  delCase(id){return this.run('cases','readwrite',s=>s.delete(id));},
  getMeta(k){return this.run('meta','readonly',s=>s.get(k));},
  setMeta(k,v){return this.run('meta','readwrite',s=>s.put(v,k));},
};
async function persist(list){
  setSaveLabel('● 儲存中…','#B8860B');
  try{await DB.putCases(list);await DB.setMeta('dirty',true);updateAdminLabel();}
  catch(e){setSaveLabel('● 儲存失敗','#C0394A');toast('儲存失敗：'+e.message);throw e;}
}
function setSaveLabel(t,color){const el=$('#save-lbl');el.textContent=t;el.style.color=color||'';}
async function updateAdminLabel(){
  if(!DB.db){setSaveLabel('● 暫存中（重整即清空）','#C0394A');return;}
  const dirty=await DB.getMeta('dirty'), last=await DB.getMeta('publishedAt');
  if(dirty)setSaveLabel('● 管理模式・有修改尚未發佈','#B45F06');
  else setSaveLabel(`● 管理模式・已發佈${last?' '+fmtTime(last):''}`,'');
}

  }catch(e){}
}

function filteredCases(){
  const q=S.q.trim().toLowerCase();
  return sortCases(cases.filter(c=>{
    if(c.branch!==S.branch)return false;
    if(c.saleDate){
      if(yearOf(c)!==S.year)return false;
      if(S.month&&monthOf(c)!==S.month)return false;
    } else if(S.month) return false;          // 未填銷售日：只在「全部」顯示
    if(S.grade==='-'?c.grade:S.grade&&c.grade!==S.grade)return false;
    if(S.status&&c.status!==S.status)return false;
    if(q&&![c.name,c.code,c.consultant].some(v=>(v||'').toLowerCase().includes(q)))return false;
    return true;
  }));
}

const QUARTERS=[{l:'第一季',f:1,t:3},{l:'第二季',f:4,t:6},{l:'第三季',f:7,t:9},{l:'第四季',f:10,t:12}];
function rangeLabel(){
  if(S.rFrom===1&&S.rTo===12)return '全年';
  const q=QUARTERS.find(q=>q.f===S.rFrom&&q.t===S.rTo);
  return (q?q.l+' ':'')+(S.rFrom===S.rTo?`${S.rFrom}月`:`${S.rFrom}～${S.rTo}月`);
}
function rangeBar(){
  const b=(f,t,l)=>`<button class="mbtn ${S.rFrom===f&&S.rTo===t?'active':''}" data-range="${f}-${t}">${l}</button>`;
  const ms=(id,v)=>`<select class="fsel" id="${id}" style="padding:3px 6px">${Array.from({length:12},(_,i)=>`<option value="${i+1}" ${i+1===v?'selected':''}>${i+1}月</option>`).join('')}</select>`;
  return b(1,12,'全年')+QUARTERS.map(q=>b(q.f,q.t,`${q.l}（${q.f}-${q.t}月）`)).join('')+
    `<span style="display:inline-flex;align-items:center;gap:5px;margin:0 0 6px 10px;font-size:11px;color:var(--text2)">自訂 ${ms('r-from',S.rFrom)} ～ ${ms('r-to',S.rTo)}</span>`;
}

function renderStats(){
  const yAll=statRows().filter(c=>yearOf(c)===S.year);
  const MS=Array.from({length:S.rTo-S.rFrom+1},(_,i)=>S.rFrom+i);   // 區間內的月份
  const yc=yAll.filter(c=>monthOf(c)>=S.rFrom&&monthOf(c)<=S.rTo);
  const n=yc.length, sa=yc.filter(isFull).length;
  const disc=yc.reduce((s,c)=>s+(c.discount||0),0);
  const done=yc.filter(c=>c.status==='已完成').length, carded=yc.filter(c=>c.card).length;
  const brN=new Set(yc.map(c=>c.branch)).size;
  const pct=(a,b)=>b?Math.round(a/b*100)+'%':'—';
  const tile=(l,v,s='')=>`<div class="scard"><div class="scard-lbl">${l}</div><div class="scard-val">${v}</div><div class="scard-sub">${s}</div></div>`;

  const byM=MS.map(m=>yc.filter(c=>monthOf(c)===m).length);
  const maxM=Math.max(1,...byM);
  const heat=BRANCHES.map(br=>MS.map(m=>yc.filter(c=>c.branch===br&&monthOf(c)===m).length));
  const maxH=Math.max(1,...heat.flat());
  const heatCell=(v,max)=>{if(!v)return '<td style="color:var(--border2)">·</td>';const a=.12+.78*v/max;return `<td style="background:rgba(45,74,62,${a.toFixed(2)});color:${a>.5?'#fff':'var(--text)'}">${v}</td>`;};
  const heatTd=v=>heatCell(v,maxH);

  // 各季統計（全年，不受區間影響）：只算全臉公開
  const inQ=(c,q)=>monthOf(c)>=q.f&&monthOf(c)<=q.t;
  const qRows=BRANCHES.map(br=>QUARTERS.map(q=>yAll.filter(c=>c.branch===br&&isFull(c)&&inQ(c,q))));
  const maxQ=Math.max(1,...qRows.flat().map(l=>l.length));
  const qSel=q=>S.rFrom===q.f&&S.rTo===q.t;
  const qCell=l=>{const v=l.length;if(!v)return '<td style="color:var(--border2)">·</td>';
    const a=.12+.78*v/maxQ;return `<td style="background:rgba(45,74,62,${a.toFixed(2)});color:${a>.5?'#fff':'var(--text)'}">${v}</td>`;};

  $('#content').innerHTML=`<div id="shot-area">

    <div class="stat-grid">
      ${tile('案例數',n,`${rangeLabel()}・依銷售日`)}
      ${tile('有案例的分院',`${brN}<span style="font-size:13px;color:var(--text3)"> / ${BRANCHES.length}</span>`,'')}
      ${tile('全臉公開',sa,`占全部案例 ${pct(sa,n)}`)}
      ${tile('折讓金額合計','$'+fmt(disc),'')}
      ${tile('平均每案折讓','$'+fmt(n?Math.round(disc/n):0),'合計 ÷ 案例數')}
      ${tile('已完成',done,`完成率 ${pct(done,n)}`)}
      ${tile('櫃檯已開卡',carded,`開卡率 ${pct(carded,n)}`)}
    </div>
    <div class="panel"><div class="panel-h">各季全臉公開件數（${S.year} 年全年・點季別可切換）</div><div class="ovx"><table class="mtable">
      <thead><tr><th>分院</th>${QUARTERS.map(q=>`<th><button class="mbtn ${qSel(q)?'active':''}" data-range="${q.f}-${q.t}" style="padding:2px 6px">${q.l}<br><span style="font-weight:400;font-size:10px">${q.f}-${q.t}月</span></button></th>`).join('')}<th>全年</th></tr></thead>
      <tbody>${BRANCHES.map((br,bi)=>`<tr><td>${br}</td>${qRows[bi].map(qCell).join('')}<td class="tot">${qRows[bi].reduce((s,l)=>s+l.length,0)}</td></tr>`).join('')}
      <tr class="total"><td>合計</td>${QUARTERS.map((q,qi)=>`<td>${qRows.reduce((s,r)=>s+r[qi].length,0)}</td>`).join('')}<td>${yAll.filter(isFull).length}</td></tr></tbody>

function boardPeriods(){
  const ys=yearsList(), ms=new Set([`${CUR_Y}-${pad(CUR_M)}`]);
  statRows().forEach(c=>{if(c.saleDate)ms.add(c.saleDate.slice(0,7));});
  return [{v:'all',l:'全部期間'},...ys.map(y=>({v:'Y:'+y,l:`${y} 年`})),
    ...[...ms].sort().reverse().map(m=>({v:'M:'+m,l:`${m.slice(0,4)} 年 ${+m.slice(5)} 月`}))];
}
function inBoardPeriod(c){
  if(S.board==='all')return true;
  if(!c.saleDate)return false;
  const [t,v]=S.board.split(':');
  return t==='Y'?c.saleDate.startsWith(v+'-'):c.saleDate.startsWith(v);
}
function boardLabel(){return boardPeriods().find(p=>p.v===S.board)?.l||'';}

function renderBoard(){
  const ps=boardPeriods(); if(!ps.some(p=>p.v===S.board))S.board=ps[0].v;
  $('#board-period').innerHTML=ps.map(p=>`<option value="${p.v}" ${p.v===S.board?'selected':''}>${p.l}</option>`).join('');
  const pc=statRows().filter(inBoardPeriod);
  // 戰情榜只比全臉公開：先比全臉公開件數，同數比總案例數（sa＝全臉公開件數，n＝總案例數）
  const rank=(a,b)=>b.sa-a.sa||b.n-a.n;
  const brRows=BRANCHES.map(br=>{const l=pc.filter(c=>c.branch===br);return {name:br,n:l.length,sa:l.filter(isFull).length};}).sort(rank);
  const cm=new Map();
  // 一筆案例有多位諮詢師（以「、」分隔）時，每人各計一筆
  pc.forEach(c=>String(c.consultant||'').split(/[、,，\/]/).map(x=>x.trim()).filter(Boolean).forEach(nm=>{
    const k=c.branch+'|'+nm; if(!cm.has(k))cm.set(k,{name:nm,branch:c.branch,n:0,sa:0});
    const r=cm.get(k); r.n++; if(isFull(c))r.sa++;}));
  const csRows=[...cm.values()].sort(rank).slice(0,10);
  const medals=['🥇','🥈','🥉'];
  const row=(r,i,tag)=>`<div class="board-row ${i<3?'top'+(i+1):''}">
    <div class="board-rank">${i+1}</div>
    <div class="board-name-wrap"><div class="board-name">${i<3?medals[i]+' ':''}${esc(r.name)}${tag?`<span class="board-branch-tag">${esc(r.branch)}</span>`:''}</div>
    </div>
    <div class="board-count-wrap"><div class="board-count">${r.sa}</div><div class="board-count-lbl">全臉公開</div></div></div>`;
  const empty=t=>`<div class="empty" style="padding:30px 10px"><span class="empty-ico">🏆</span><p>${t}</p></div>`;
  $('#content').innerHTML=`<div class="board-wrap" id="shot-area">
    <div class="board-head">
      <div class="board-head-eyebrow">MEGAIA · HONOR BOARD</div>
      <div class="board-head-title">🏆 全臉公開戰力榜｜${esc(boardLabel())}</div>
      <div class="board-head-sub">期間共 ${pc.filter(isFull).length} 件全臉公開案例。排名依全臉公開件數，同數比總案例數。</div>
    </div>
    <div class="board-body"><div class="board-grid">
      <div><div class="board-col-title">分院排行 <small>六家全列</small></div>${brRows.map((r,i)=>row(r,i,false)).join('')}</div>
      <div><div class="board-col-title">諮詢師排行 <small>前 10 名・跨分院分開計</small></div>${csRows.length?csRows.map((r,i)=>row(r,i,true)).join(''):empty('此期間尚無填寫諮詢師的案例')}</div>
    </div></div>
    <div class="board-foot">每一筆授權案例，都是美加最珍貴的真實口碑資產 ✨</div>
  </div>`;
}

function openOverlay(html,onClose){
  const ov=document.createElement('div'); ov.className='overlay'; ov.innerHTML=html;
  const close=()=>{ov.remove();document.removeEventListener('keydown',onKey);onClose&&onClose();};
  const onKey=e=>{if(e.key==='Escape')close();};
  ov.addEventListener('mousedown',e=>{ov._down=e.target===ov;});
  ov.addEventListener('click',e=>{if(e.target===ov&&ov._down)close();if(e.target.closest('[data-close]'))close();});
  document.addEventListener('keydown',onKey);
  $('#overlay-root').appendChild(ov);
  return {el:ov,close};
}
function notice(title,body){
  openOverlay(`<div class="modal" style="max-width:460px"><div class="modal-h"><span class="modal-t">${title}</span><button class="btn btn-icon" data-close>✕</button></div>
  <div class="modal-b">${body}</div><div class="modal-f"><button class="btn btn-primary" data-close>知道了</button></div></div>`);
}

    ov.close();

async function clearAll(){
  if(!cases.length){toast('目前沒有資料');return;}

  if(prompt('請輸入「清空」兩個字確認：')!=='清空'){toast('已取消');return;}

  cases=[]; await DB.setMeta('dirty',true);
  render(); updateAdminLabel(); toast('已清空全部資料，請重新匯入報表');
}

    </form>

// ══════════════════════════════════════════
//  發佈（管理模式）：產生加密的 data.enc.json
// ══════════════════════════════════════════
async function publish(){
  const keys=await DB.getMeta('keys')||{};
  const missing=ACCOUNTS.filter(a=>!keys[a.id]).map(a=>a.id);
  if(missing.length){notice('還不能發佈',`<p class="notice-sub">這些帳號還沒設定密碼：<b>${missing.join('、')}</b><br>請先按「🔑 設定帳號密碼」。</p>`);return;}
  const updatedAt=new Date().toISOString();
  const strip=c=>({id:c.id,branch:c.branch,saleDate:c.saleDate||'',surgeryDate:c.surgeryDate||'',name:c.name||'',code:c.code||'',
    grade:c.grade||'',discount:c.discount||0,consultant:c.consultant||'',status:c.status||'',cbPre:!!c.cbPre,cbPost:!!c.cbPost,card:!!c.card,note:c.note||''});
  const anon=cases.map(c=>({branch:c.branch,saleDate:c.saleDate||'',grade:c.grade||'',discount:c.discount||0,
    consultant:c.consultant||'',status:c.status||'',card:!!c.card,cbPre:!!c.cbPre,cbPost:!!c.cbPost}));
  const out={v:1,iter:ITER,updatedAt,accounts:{}};
  for(const a of ACCOUNTS){
    const k=keys[a.id];
    const payload={id:a.id,label:a.branch?a.branch+'分院':'總部',branch:a.branch,updatedAt,
      cases:(a.branch?cases.filter(c=>c.branch===a.branch):cases).map(strip),all:a.branch?anon:null};
    out.accounts[normAcc(a.id)]={s:k.s,w:k.w,d:await seal(await aesKey(unb64(k.k)),te.encode(JSON.stringify(payload)))};
  }
  const blob=new Blob([JSON.stringify(out)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='data.enc.json';
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),3000);
  await DB.setMeta('dirty',false); await DB.setMeta('publishedAt',updatedAt); updateAdminLabel();
  notice('🌐 發佈檔已產生',`<div class="notice-list">共 <b>${cases.length}</b> 筆案例、<b>${ACCOUNTS.length}</b> 個帳號</div>
    <p class="notice-sub">已下載 <b>data.enc.json</b>（在「下載」資料夾）。<br>請跟 Claude 說「<b>發佈好了</b>」，Claude 會幫你上傳到網站。<br>檔案已加密，沒有密碼看不到內容。</p>`);
}

  ['surgeryDate',['手術日','施作日','療程日','術日']],
  ['code',['顧客代碼','客戶代碼','客編','會員編號','病歷號','顧客編號','客戶編號']],
  ['name',['顧客姓名','客戶姓名','姓名','顧客名稱','客戶名稱']],
  ['grade',['授權','等級','分級','商品名稱','商品','品項']],
  ['discount',['折讓']],
  ['branch',['分店碼','店碼','分院','院區','門市','分店','診所']],
  ['consultant',['諮詢師','諮詢','銷售業務','業務','顧問']],
  ['status',['狀態']],
  ['card',['開卡','櫃檯']],
  ['cbPre',['術前']],
  ['cbPost',['術後']],
  ['note',['備註','說明']],
];
const caseKey=c=>`${c.branch}|${(c.code||c.name||'').trim()}|${c.saleDate||''}`;

function mapHeaders(hdr){
  const used=new Set(), map={};
  for(const [f,keys] of FIELD_KEYS){
    for(const k of keys){
      const i=hdr.findIndex((h,j)=>!used.has(j)&&h.includes(k)&&!(f==='name'&&/諮詢|業務|顧問/.test(h)));
      if(i>=0){map[f]=i;used.add(i);break;}
    }
  }
  if(map.saleDate==null){const i=hdr.findIndex((h,j)=>!used.has(j)&&h.includes('日期'));if(i>=0){map.saleDate=i;used.add(i);}}
  return map;
}

function toDate(v){
  if(v==null||v==='')return '';
  const mk=(y,m,d)=>{y=+y;m=+m;d=+d;if(y<1911)y+=1911;if(m<1||m>12||d<1||d>31||y<1950||y>2200)return '';return `${y}-${pad(m)}-${pad(d)}`;};
  if(v instanceof Date&&!isNaN(v))return mk(v.getFullYear(),v.getMonth()+1,v.getDate());
  if(typeof v==='number'){
    if(v>19000000&&v<30000000){const s=String(Math.round(v));return mk(s.slice(0,4),s.slice(4,6),s.slice(6,8));}
    if(v>=1000000&&v<2000000){const s=String(Math.round(v));return mk(s.slice(0,3),s.slice(3,5),s.slice(5,7));}
    if(v>0&&v<100000){const d=XLSX.SSF.parse_date_code(v);return d?mk(d.y,d.m,d.d):'';}
    return '';
  }
  const s=String(v).trim();
  if(/^\d{8}$/.test(s))return mk(s.slice(0,4),s.slice(4,6),s.slice(6,8));
  if(/^\d{7}$/.test(s))return mk(s.slice(0,3),s.slice(3,5),s.slice(5,7));
  const m=s.match(/(\d{2,4})\s*[\/\-.年]\s*(\d{1,2})\s*[\/\-.月]\s*(\d{1,2})/);
  return m?mk(m[1],m[2],m[3]):'';
}
const BRANCH_CODES={M001:'仁愛',M002:'桃園',M003:'向上',M005:'巨蛋',M006:'竹北',M007:'北屯'};
const toBranch=s=>{const t=String(s||'');return BRANCHES.find(b=>t.includes(b))||(Object.entries(BRANCH_CODES).find(([k])=>t.toUpperCase().includes(k))||[])[1]||'';};
const toGrade=s=>{const t=String(s||'').trim();
  if(t.includes('全臉'))return '全臉公開'; if(t.includes('匿名'))return '匿名公開';
  if(t.includes('院內'))return '院內公開'; if(t.includes('無折扣'))return '無折扣';
  const m=t.match(/^([A-Za-z])(?![A-Za-z])/); return m&&OLD_GRADE[m[1].toUpperCase()]||'';};
const toInt=s=>{const t=String(s??'').replace(/[,\s$＄元NT]/gi,'');if(t==='')return null;const n=parseFloat(t);return isNaN(n)?null:Math.round(n);};
const toBool=s=>{if(s===true)return true;if(s===false)return false;const t=String(s??'').trim().toUpperCase();
  return ['TRUE','✓','✔','V','Y','YES','是','已開卡','完成','已完成','O','Ｏ','○','1','有'].includes(t);};
const toStatus=s=>{const t=String(s||'').trim();if(!t)return '';if(STATUSES.includes(t))return t;
  if(t.includes('取消'))return '取消';if(t.includes('完成'))return '已完成';if(t.includes('術後'))return '待術後照';if(t.includes('素材'))return '素材整理中';if(t.includes('進行'))return '進行中';return t;};

async function readWorkbook(file){
  const buf=await file.arrayBuffer();
  if(/\.csv$/i.test(file.name)){
    let text=new TextDecoder('utf-8').decode(buf);
    if(text.includes('�')){try{text=new TextDecoder('big5').decode(buf);}catch(e){}}
    return XLSX.read(text.replace(/^﻿/,''),{type:'string',raw:true});
  }
  return XLSX.read(new Uint8Array(buf),{type:'array'});
}

async function importFiles(files){
  if(!files.length)return;
  const fallback=S.branch;
  const index=new Map(cases.map(c=>[caseKey(c),c]));
  const created=new Set(), touched=new Map();
  let added=0,updated=0,skipped=0,sheetsOk=0;
  const skippedSheets=[], perBranch={}, perYear={};
  try{
    for(const file of files){
      const wb=await readWorkbook(file);
      for(const sn of wb.SheetNames){
        const rows=XLSX.utils.sheet_to_json(wb.Sheets[sn],{header:1,raw:true,defval:''});
        let h=-1,map=null;
        for(let i=0;i<Math.min(15,rows.length);i++){
          const m=mapHeaders(rows[i].map(x=>String(x).replace(/\s/g,'')));
          if(m.name!=null||m.code!=null){h=i;map=m;break;}
        }
        if(h<0){skippedSheets.push(`${file.name}／${sn}`);continue;}
        sheetsOk++;
        const sheetBranch=toBranch(sn);
        for(let i=h+1;i<rows.length;i++){
          const r=rows[i];
          if(!r.some(x=>String(x).trim()!==''))continue;
          const g=f=>map[f]!=null?r[map[f]]:'';
          // 銷售報表的「客戶姓名」可能是「代碼 換行 姓名」，姓名前可能有 ★
          let name=String(g('name')).trim(), code=String(g('code')).trim();
          if(/合計|單日/.test(name))continue;
          const np=name.split(/\r?\n|\\n/).map(x=>x.trim()).filter(Boolean);
          if(np.length>=2){if(!code)code=np[0];name=np[np.length-1];}
          name=name.replace(/★/g,'').trim();
          if(!name&&!code){skipped++;continue;}
          // 諮詢師欄可能是多行「姓名-工號」
          const cons=[...new Set(String(g('consultant')).split(/\r?\n|\\n|、/).map(x=>x.split('-')[0].trim())
            .filter(x=>x&&!/[A-Za-z]{2,}\d{2,}/.test(x)&&!x.includes('行銷')))].join('、');
          const gradeRaw=String(g('grade'));
          const rec={name,code,branch:toBranch(g('branch'))||sheetBranch||fallback,saleDate:toDate(g('saleDate')),
            surgeryDate:toDate(g('surgeryDate')),grade:toGrade(gradeRaw),consultant:cons,
            status:toStatus(g('status')),note:String(g('note')).trim()};
          const disc=toInt(g('discount'));
          if(disc!=null)rec.discount=disc;
          else if(gradeRaw.includes('諮詢師無回饋'))rec.discount=0;
          else if(rec.grade)rec.discount=GRADE_AMT[rec.grade];
          for(const f of ['card','cbPre','cbPost']){const raw=g(f); if(String(raw).trim()!=='')rec[f]=toBool(raw);}
          const k=caseKey(rec);
          let c=index.get(k);
          if(c){
            for(const [f,val] of Object.entries(rec))if(val!==''&&val!=null)c[f]=val;
            c.updatedAt=Date.now();
            if(!created.has(c.id)&&!touched.has(c.id))updated++;
          } else {
            c={id:uid(),createdAt:Date.now(),discount:0,card:false,cbPre:false,cbPost:false,note:'',...rec,status:rec.status||'進行中'};
            index.set(k,c); cases.push(c); created.add(c.id); added++;
          }
          touched.set(c.id,c);
          perBranch[c.branch]=(perBranch[c.branch]||0)+1;
          const y=yearOf(c); if(y){const yk=c.branch+'|'+y;perYear[yk]=(perYear[yk]||0)+1;}
        }
      }
    }
    if(touched.size)await persist([...touched.values()]);
  }catch(err){
    cases=await DB.allCases();
    render(); notice('匯入失敗',`<p class="notice-sub">${esc(err.message)}</p>`); return;
  }
  const top=Object.entries(perBranch).sort((a,b)=>b[1]-a[1])[0];
  if(top){
    S.view='branch'; S.branch=top[0]; S.month=0;
    const ty=Object.entries(perYear).filter(([k])=>k.startsWith(top[0]+'|')).sort((a,b)=>b[1]-a[1])[0];
    if(ty)S.year=+ty[0].split('|')[1];
  }
  render();
  notice('📥 匯入完成',`<div class="notice-list">新增 <b>${added}</b> 筆　更新 <b>${updated}</b> 筆　略過 <b>${skipped}</b> 列</div>
    <div class="notice-sub">讀取 ${sheetsOk} 個工作表${top?`，已切換到匯入最多筆的分院「${top[0]}」`:''}。
    ${skipped?'<br>略過的列：沒有顧客姓名也沒有顧客代碼。':''}
    ${skippedSheets.length?`<br>找不到「顧客姓名／顧客代碼」標題而略過的工作表：${skippedSheets.map(esc).join('、')}`:''}
    <br><b>確認沒問題後，請按「🌐 發佈到網站」。</b></div>`);
}

function doExport(){
  const hdr=['分院','銷售日','手術日','顧客姓名','顧客代碼','授權等級','折讓金額','諮詢師','狀態','術前','術後','櫃檯開卡','備註'];
  const toRow=c=>[c.branch,c.saleDate||'',c.surgeryDate||'',c.name||'',c.code||'',c.grade||'',c.discount||0,c.consultant||'',
    c.status||'',c.cbPre?'✓':'',c.cbPost?'✓':'',c.card?'是':'否',c.note||''];
  const sheet=list=>{const ws=XLSX.utils.aoa_to_sheet([hdr,...list.map(toRow)]);
    ws['!cols']=[6,11,11,10,12,8,10,10,10,6,6,8,30].map(w=>({wch:w}));return ws;};
  const all=sortCases([...cases]).sort((a,b)=>BRANCHES.indexOf(a.branch)-BRANCHES.indexOf(b.branch));
  const wb=XLSX.utils.book_new(), brs=myBranches();
  if(brs.length>1)XLSX.utils.book_append_sheet(wb,sheet(all),'全部');
  brs.forEach(br=>XLSX.utils.book_append_sheet(wb,sheet(all.filter(c=>c.branch===br)),br));
  const who=SESSION&&SESSION.branch?SESSION.branch+'_':'';
  XLSX.writeFile(wb,`口碑案例_${who}${NOW.getFullYear()}${pad(NOW.getMonth()+1)}${pad(NOW.getDate())}.xlsx`);
  toast(`↓ 已匯出 ${cases.length} 筆`);
}

async function doShot(){
  let name, target;
  if(S.view==='branch'){name=`口碑案例_${S.branch}_${S.year}_${S.month?S.month+'月':'全部'}`;target=$('#app');}
  else if(S.view==='stats'){name=`口碑案例_統計_${S.year}_${rangeLabel().replace(/\s/g,'')}`;target=$('#shot-area');}
  else{name=`口碑案例_戰情榜_${boardLabel().replace(/\s/g,'')}`;target=$('#shot-area');}
  shotEl(target,name);
}
async function shotEl(target,name){
  if(typeof html2canvas==='undefined'){toast('截圖功能尚未載入，請稍候再試');return;}
  toast('擷取中…');
  try{
    const cv=await html2canvas(target,{backgroundColor:'#F4F2ED',scale:2,useCORS:true,
      ignoreElements:el=>el.classList&&el.classList.contains('no-shot')});
    cv.toBlob(b=>{
      const a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download=name.replace(/[\\/:*?"<>|]/g,'')+'.jpg';
      document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),2000);
      toast('已下載 '+a.download);
    },'image/jpeg',0.92);
  }catch(e){toast('截圖失敗，請重試');}
}

let tt;
function toast(msg){const el=$('#toast');el.textContent=msg;el.style.display='block';clearTimeout(tt);tt=setTimeout(()=>el.style.display='none',3000);}

async function loadEnc(){
  const r=await fetch('data.enc.json?t='+Date.now(),{cache:'no-store'});
  if(!r.ok)throw new Error('nodata');
  return r.json();
}
function startSession(d){
  SESSION={id:d.id,label:d.label,branch:d.branch,updatedAt:d.updatedAt};
  cases=(d.cases||[]).map(fixGrade); allRows=d.all?d.all.map(fixGrade):null;
  if(d.branch)S.branch=d.branch;
  $('#login').hidden=true; $('#app').hidden=false;
  renderHeader(); render();
}

(async function init(){
  prefs(false);
  if(ADMIN){
    try{
      await DB.open();cases=await DB.allCases();
      const old=cases.filter(c=>OLD_GRADE[c.grade]);
      if(old.length){old.forEach(fixGrade);await persist(old);}
    }
    catch(e){notice('無法開啟本機儲存',`<p class="notice-sub">這個瀏覽器不允許儲存資料（可能是無痕模式），資料不會被保存。</p>`);}
    $('#app').hidden=false; renderHeader(); updateAdminLabel(); render();
    return;
  }
  let file=null;
  try{file=await loadEnc();}catch(e){}
  let saved=null; try{saved=JSON.parse(sessionStorage.getItem('koubei_session')||'null');}catch(e){}
  if(file&&saved&&saved.updatedAt===file.updatedAt){startSession(saved);return;}
  $('#login').hidden=false;
  $('#lg-note').textContent=file?`資料更新：${fmtTime(file.updatedAt)}`:'網站目前還沒有資料。';
  if(saved&&file)$('#lg-err').textContent='資料已更新，請重新登入。';
  $('#lg-acc').focus();
  $('#login-form').addEventListener('submit',async e=>{
    e.preventDefault();
    const acc=$('#lg-acc').value, pw=$('#lg-pw').value, btn=$('#lg-btn');
    if(!file){$('#lg-err').textContent='網站目前還沒有資料。';return;}
    if(!acc.trim()||!pw){$('#lg-err').textContent='請輸入帳號和密碼。';return;}
    btn.disabled=true; btn.textContent='登入中…'; $('#lg-err').textContent='';
    try{
      const d=await loginDecrypt(file,acc,pw);
      try{sessionStorage.setItem('koubei_session',JSON.stringify(d));}catch(err){}
      startSession(d);
    }catch(err){
      $('#lg-err').textContent='帳號或密碼錯誤。'; $('#lg-pw').value=''; $('#lg-pw').focus();
    }finally{btn.disabled=false; btn.textContent='登入';}
  });
})();
